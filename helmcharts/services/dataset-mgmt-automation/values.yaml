## Kubernetes namespace for all resources
namespace: dataset-mgmt

## Override chart name / full name if needed
nameOverride: ""
fullnameOverride: ""

## Container image
image:
  repository: ghcr.io/maheshkumargangula/dataset-mgmt-automation
  tag: sha-d844336
  pullPolicy: IfNotPresent

## Image pull secrets for GHCR authentication in-cluster
## Create secret first:
##   kubectl create secret docker-registry ghcr-secret \
##     --docker-server=ghcr.io \
##     --docker-username=<github-username> \
##     --docker-password=<github-token> \
##     -n dataset-mgmt
imagePullSecrets: []
# - name: ghcr-secret

## CronJob configuration
cronjob:
  ## Cron schedule expression (default: daily at 2am)
  schedule: "0 2 * * *"
  ## Set to true to suspend automatic scheduling (trigger manually via kubectl)
  suspend: false
  ## Prevent concurrent runs
  concurrencyPolicy: Forbid
  ## Number of successful/failed job histories to retain
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  ## Pod restart policy
  restartPolicy: OnFailure

## Application configuration
config:
  ## Base URL for the Dataset Management REST APIs
  ## Internal Kubernetes service URL: dataset-api service in dataset-api namespace
  baseUrl: "http://dataset-api.dataset-api.svc.cluster.local:3000"

## Resource requests and limits for the job container
resources: {}
# requests:
#   cpu: "100m"
#   memory: "128Mi"
# limits:
#   cpu: "500m"
#   memory: "256Mi"

## Node selector for pod scheduling
nodeSelector: {}

## Tolerations
tolerations: []

## Affinity rules
affinity: {}

## Datasets to manage.
## Each entry is a dataset_id — must match a folder name under datasets/<dataset_id>/
## containing schema.json and config.json.
## To add a new dataset: add the id here and create the corresponding folder.
datasets:
  - sb-telemetry-v10
  - obsrv-automation-test
  - sb-telemetry
  - wfs-telemetry
