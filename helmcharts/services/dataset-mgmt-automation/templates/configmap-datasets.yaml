{{/*
  One ConfigMap per dataset — holds schema.json and config.json.
  Each ConfigMap is named: <fullname>-dataset-<dataset_id>
  Mounted at: /app/datasets/<dataset_id>/
  Files are read from: datasets/<dataset_id>/schema.json and datasets/<dataset_id>/config.json
*/}}
{{- range .Values.datasets }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataset-mgmt-automation.fullname" $ }}-dataset-{{ . }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "dataset-mgmt-automation.labels" $ | nindent 4 }}
    app.kubernetes.io/component: dataset-config
    dataset-id: {{ . | quote }}
data:
  schema.json: |
    {{- $.Files.Get (printf "datasets/%s/schema.json" .) | nindent 4 }}
  config.json: |
    {{- $.Files.Get (printf "datasets/%s/config.json" .) | nindent 4 }}
{{- end }}
