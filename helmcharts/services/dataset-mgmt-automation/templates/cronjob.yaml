apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dataset-mgmt-automation.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dataset-mgmt-automation.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  suspend: {{ .Values.cronjob.suspend }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "dataset-mgmt-automation.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: {{ .Values.cronjob.restartPolicy }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            {{- range .Values.datasets }}
            - name: dataset-{{ . }}
              configMap:
                name: {{ include "dataset-mgmt-automation.fullname" $ }}-dataset-{{ . }}
            {{- end }}
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: BASE_URL
                  value: {{ .Values.config.baseUrl | quote }}
              volumeMounts:
                {{- range .Values.datasets }}
                - name: dataset-{{ . }}
                  mountPath: /app/datasets/{{ . }}
                  readOnly: true
                {{- end }}
              {{- with .Values.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
