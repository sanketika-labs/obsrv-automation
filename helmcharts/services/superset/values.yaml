extraSecrets:
  custom_sso_security_manager.py: |
    import logging
    import os
    import redis
    from superset.security import SupersetSecurityManager
    from flask_appbuilder.security.manager import AUTH_OAUTH

    def env(key, default=None):
        return os.getenv(key, default)

    def set_token_for_user(user_id, token, expiration=86400):
        sso_cache = redis.Redis(
            host=env("REDIS_HOST"),
            port=int(env("REDIS_PORT")),
            password=env("REDIS_PASSWORD"),
            db=int(env("REDIS_DB", 1)),
            decode_responses=False,
        )
        print(f"Setting token for user {user_id}: {token[:20]}... (expires in {expiration} seconds)")
        sso_cache.setex(f"sso_user_token:{user_id}", expiration, token)

    class CustomSsoSecurityManager(SupersetSecurityManager):
        def __init__(self, appbuilder):
            super(CustomSsoSecurityManager, self).__init__(appbuilder)
            app = self.appbuilder.get_app
            app.config.setdefault("AUTH_ROLES_MAPPING", {})
            app.config.setdefault("AUTH_TYPE", AUTH_OAUTH)

        def oauth_user_info(self, provider, response=None):
            logging.info("Oauth2 provider: %s", provider)

            if provider == "cognito":
                token_data = self.appbuilder.sm.oauth_remotes[provider].token
                access_token = token_data.get("access_token") if token_data else None

                _region = env("COGNITO_REGION", "us-east-1")
                _domain = env("COGNITO_DOMAIN", "")
                userinfo_url = (
                    f"https://{_domain}.auth.{_region}.amazoncognito.com/oauth2/userInfo"
                )
                me = self.appbuilder.sm.oauth_remotes[provider].get(userinfo_url)
                me.raise_for_status()
                data = me.json()
                logging.info("User info from Cognito: %s", data)

                username = (
                    data.get("username")
                    or data.get("cognito:username")
                    or data.get("sub", "")
                )
                first_name = data.get("given_name", "")
                last_name = data.get("family_name", "")
                if not first_name and not last_name:
                    full = data.get("name", username)
                    parts = full.split(" ", 1)
                    first_name = parts[0]
                    last_name = parts[1] if len(parts) > 1 else ""

                if access_token and username:
                    expires = token_data.get("expires_in", 86400)
                    set_token_for_user(username, access_token, expires)

                groups = data.get("cognito:groups", [])
                return {
                    "name": data.get("name", f"{first_name} {last_name}".strip()),
                    "email": data.get("email", ""),
                    "first_name": first_name,
                    "last_name": last_name,
                    "id": username,
                    "username": username,
                    "role_keys": groups,
                }

            if provider == "obsrv":
                token_data = self.appbuilder.sm.oauth_remotes[provider].token
                access_token = token_data.get("access_token") if token_data else None

                me = self.appbuilder.sm.oauth_remotes[provider].get(
                    f'http{{ if .Values.global.ssl_enabled }}s{{ end }}://{{ .Values.global.domain }}/auth/realms/obsrv/protocol/openid-connect/userinfo'
                )
                me.raise_for_status()
                data = me.json()
                logging.info("User info from Keycloak: %s", data)

                if access_token and data.get("preferred_username"):
                    set_token_for_user(
                        data["preferred_username"],
                        token_data.get("access_token"),
                        token_data.get("expires_in", 86400),
                    )

                return {
                    "name": data.get("name", ""),
                    "email": data.get("email", ""),
                    "first_name": data.get("given_name", ""),
                    "last_name": data.get("family_name", ""),
                    "id": data.get("preferred_username", ""),
                    "username": data.get("preferred_username", ""),
                }

            return {}

